name: Fetch Race Results

on:
  workflow_dispatch:
    inputs:
      venue_slug:
        description: 'Venue slug (e.g. loudenvielle-2026)'
        required: true
        type: choice
        options:
          - race-of-south-korea-2026
          - loudenvielle-2026
          - leogang-2026
          - lenzerheide-2026
          - la-thuile-2026
          - pal-arinsal-2026
          - les-gets-2026
          - val-di-sole-2026
          - whistler-2026
          - lake-placid-2026

  schedule:
    # Poll every 30 min. The date check below gates on race days only — non-race-day
    # runs exit after the first step (no checkout, no npm ci), so idle cost is one shell command.
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  fetch-results:
    runs-on: ubuntu-latest

    steps:
      - name: Determine venue slug
        id: venue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ github.event.inputs.venue_slug }}" >> $GITHUB_OUTPUT
          else
            # Window = [finals date - 3 days, finals date + 1 day] for each round, not just
            # the assumed qual/finals pair. Learned the hard way: La Thuile's Q1/Q2 posted
            # 07-03, three days before finals (07-05), but the old case only matched
            # 07-04|07-05 — the 30-min poller had "slug=unknown" on 07-03 and silently did
            # nothing all day. The UCI's per-round qualifying schedule isn't perfectly
            # consistent round to round, so give every round a few days of leading buffer
            # (covers Q1/Q2 posting early) and one trailing day (covers a rain-delayed
            # finals). A day matching no window is a safe no-op (slug=unknown skips every
            # remaining step), so a wider window costs nothing on idle days.
            case "$(date -u +%m-%d)" in
              06-12|06-13) echo "slug=leogang-2026"      >> $GITHUB_OUTPUT ;;
              06-20|06-21) echo "slug=lenzerheide-2026"  >> $GITHUB_OUTPUT ;;
              07-0[2-6])   echo "slug=la-thuile-2026"    >> $GITHUB_OUTPUT ;;  # finals 07-05
              07-09|07-1[0-3])
                           echo "slug=pal-arinsal-2026"  >> $GITHUB_OUTPUT ;;  # finals 07-12
              08-2[0-4])   echo "slug=les-gets-2026"     >> $GITHUB_OUTPUT ;;  # finals 08-22
              08-2[7-9]|08-3[0-1])
                           echo "slug=val-di-sole-2026"  >> $GITHUB_OUTPUT ;;  # finals 08-29 (Worlds)
              09-2[4-8])   echo "slug=whistler-2026"     >> $GITHUB_OUTPUT ;;  # finals 09-27
              10-0[1-5])   echo "slug=lake-placid-2026"  >> $GITHUB_OUTPUT ;;  # finals 10-04
              *)            echo "slug=unknown"           >> $GITHUB_OUTPUT ;;
            esac
          fi

      # All remaining steps are skipped on non-race days (slug=unknown).
      # This keeps the 30-min polling cost to a single shell command on idle days.

      - name: Checkout repo
        if: steps.venue.outputs.slug != 'unknown'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.venue.outputs.slug != 'unknown'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.venue.outputs.slug != 'unknown'
        run: npm ci

      - name: Fetch and parse results
        if: steps.venue.outputs.slug != 'unknown'
        env:
          DEBUG_RESULTS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/results-fetcher.mjs ${{ steps.venue.outputs.slug }}

      - name: Commit updated results
        if: steps.venue.outputs.slug != 'unknown'
        run: |
          git config user.name "Helltrack Bot"
          git config user.email "helltrack-bot@users.noreply.github.com"

          git add public/results.json

          # Nothing changed (e.g. finals already committed on an earlier run) → done.
          if git diff --staged --quiet; then
            echo "No changes to results.json — nothing to commit."
            exit 0
          fi

          # Commit FIRST, then rebase. Because the change is now a real commit
          # (not a working-tree/staged change), git pull --rebase replays it cleanly
          # on top of remote HEAD — no stash, nothing silently unstaged.
          git commit -m "results: ${{ steps.venue.outputs.slug }} $(date -u '+%Y-%m-%d %H:%M UTC')"

          # The hourly cache-refresh workflow pushes to the same branch, so a push can
          # race. Rebase-and-push with retries; different files means rebase won't conflict.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && { echo "Pushed on attempt $attempt."; exit 0; }
            echo "Push attempt $attempt failed (likely a concurrent push) — retrying in 10s..."
            sleep 10
          done

          echo "::error::Failed to push results after 5 attempts."
          exit 1

      # TEMPORARY (remove before merge): dispatch-only hook to develop the ChronoRace
      # fetcher. chronorace-fetch.yml can't be dispatched until it is on the default branch.
      - name: TEMP ChronoRace probe
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/tissot-fetcher.mjs 2026 --validate 2>&1 | tee scripts/probe/out.txt
          git config user.name "Helltrack Bot"
          git config user.email "helltrack-bot@users.noreply.github.com"
          git add -f scripts/probe/out.txt
          git diff --staged --quiet && exit 0
          git commit -m 'temp: probe output'
          BRANCH="${GITHUB_REF_NAME}"
          git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"
