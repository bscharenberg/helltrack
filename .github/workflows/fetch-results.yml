name: Fetch Race Results

on:
  workflow_dispatch:
    inputs:
      venue_slug:
        description: 'Venue slug (e.g. loudenvielle-2026)'
        required: true
        type: choice
        options:
          - race-of-south-korea-2026
          - loudenvielle-2026
          - leogang-2026
          - lenzerheide-2026
          - la-thuile-2026
          - pal-arinsal-2026
          - les-gets-2026
          - val-di-sole-2026
          - whistler-2026
          - lake-placid-2026

  schedule:
    # Targeted runs: fire immediately after each session wraps (UTC).
    # Leogang (Europe/Vienna = UTC+2 in June):
    - cron: '30 14 12 6 *'   # Leogang qualifying  — after Q2 Women (~16:30 Vienna)
    - cron: '30 13 13 6 *'   # Leogang finals      — after Women Elite (~15:30 Vienna)
    # Fallback: poll every 30 min on race days. Date check below gates on race days
    # only — non-race-day runs exit after the first step (no checkout, no npm ci).
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  fetch-results:
    runs-on: ubuntu-latest

    steps:
      - name: Determine venue slug
        id: venue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ github.event.inputs.venue_slug }}" >> $GITHUB_OUTPUT
          else
            case "$(date -u +%m-%d)" in
              06-12|06-13) echo "slug=leogang-2026"      >> $GITHUB_OUTPUT ;;
              06-20|06-21) echo "slug=lenzerheide-2026"  >> $GITHUB_OUTPUT ;;
              07-04|07-05) echo "slug=la-thuile-2026"    >> $GITHUB_OUTPUT ;;
              07-11|07-12) echo "slug=pal-arinsal-2026"  >> $GITHUB_OUTPUT ;;
              08-22|08-23) echo "slug=les-gets-2026"     >> $GITHUB_OUTPUT ;;
              08-29|08-30) echo "slug=val-di-sole-2026"  >> $GITHUB_OUTPUT ;;
              09-26|09-27) echo "slug=whistler-2026"     >> $GITHUB_OUTPUT ;;
              10-03|10-04) echo "slug=lake-placid-2026"  >> $GITHUB_OUTPUT ;;
              *)            echo "slug=unknown"           >> $GITHUB_OUTPUT ;;
            esac
          fi

      # All remaining steps are skipped on non-race days (slug=unknown).
      # This keeps the 30-min polling cost to a single shell command on idle days.

      - name: Checkout repo
        if: steps.venue.outputs.slug != 'unknown'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.venue.outputs.slug != 'unknown'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.venue.outputs.slug != 'unknown'
        run: npm ci

      - name: Fetch and parse results
        if: steps.venue.outputs.slug != 'unknown'
        run: node scripts/results-fetcher.mjs ${{ steps.venue.outputs.slug }}

      - name: Commit updated results
        if: steps.venue.outputs.slug != 'unknown'
        run: |
          git config user.name "Helltrack Bot"
          git config user.email "helltrack-bot@users.noreply.github.com"
          git add public/results.json
          git stash
          git pull --rebase origin main
          git stash pop
          git diff --staged --quiet || git commit -m "results: ${{ steps.venue.outputs.slug }} $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
