name: Fetch Race Results

on:
  # Manual trigger — run this after each race weekend
  # Go to Actions tab → Fetch Race Results → Run workflow → enter venue slug
  workflow_dispatch:
    inputs:
      venue_slug:
        description: 'Venue slug (e.g. loudenvielle-2026)'
        required: true
        type: choice
        options:
          - race-of-south-korea-2026
          - loudenvielle-2026
          - leogang-2026
          - lenzerheide-2026
          - la-thuile-2026
          - pal-arinsal-2026
          - les-gets-2026
          - val-di-sole-2026
          - whistler-2026
          - lake-placid-2026

  # Automatic triggers — runs Sunday evening after each race
  # Times are UTC. Races finish ~16:00-17:00 local time.
  # Running at 20:00 UTC gives 3-4 hours for results to be published.
  schedule:
    # R2 Loudenvielle — Sun May 31
    - cron: '0 20 31 5 *'
    # R3 Leogang — Sun Jun 14
    - cron: '0 20 14 6 *'
    # R4 Lenzerheide — Sun Jun 21
    - cron: '0 20 21 6 *'
    # R5 La Thuile — Sun Jul 5
    - cron: '0 20 5 7 *'
    # R6 Pal Arinsal — Sun Jul 12
    - cron: '0 20 12 7 *'
    # R7 Les Gets — Sun Aug 23
    - cron: '0 20 23 8 *'
    # Worlds Val di Sole — Sun Aug 30
    - cron: '0 20 30 8 *'
    # R8 Whistler — Sun Sep 27
    - cron: '0 20 27 9 *'
    # R9 Lake Placid — Sun Oct 4
    - cron: '0 20 4 10 *'

jobs:
  fetch-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Determine venue slug:
      # - If triggered manually, use the input
      # - If triggered by schedule, map the date to the right slug
      - name: Determine venue slug
        id: venue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ github.event.inputs.venue_slug }}" >> $GITHUB_OUTPUT
          else
            # Map today's date to venue slug
            MONTH=$(date -u +%m)
            DAY=$(date -u +%d)
            case "${MONTH}-${DAY}" in
              05-31) echo "slug=loudenvielle-2026" >> $GITHUB_OUTPUT ;;
              06-14) echo "slug=leogang-2026" >> $GITHUB_OUTPUT ;;
              06-21) echo "slug=lenzerheide-2026" >> $GITHUB_OUTPUT ;;
              07-05) echo "slug=la-thuile-2026" >> $GITHUB_OUTPUT ;;
              07-12) echo "slug=pal-arinsal-2026" >> $GITHUB_OUTPUT ;;
              08-23) echo "slug=les-gets-2026" >> $GITHUB_OUTPUT ;;
              08-30) echo "slug=val-di-sole-2026" >> $GITHUB_OUTPUT ;;
              09-27) echo "slug=whistler-2026" >> $GITHUB_OUTPUT ;;
              10-04) echo "slug=lake-placid-2026" >> $GITHUB_OUTPUT ;;
              *)     echo "slug=unknown" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Fetch and parse results
        if: steps.venue.outputs.slug != 'unknown'
        run: node scripts/results-fetcher.mjs ${{ steps.venue.outputs.slug }}

      - name: Commit updated results
        if: steps.venue.outputs.slug != 'unknown'
        run: |
          git config user.name "Helltrack Bot"
          git config user.email "helltrack-bot@users.noreply.github.com"
          git add public/results.json
          git stash
          git pull --rebase origin main
          git stash pop
          git diff --staged --quiet || git commit -m "results: ${{ steps.venue.outputs.slug }} $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
