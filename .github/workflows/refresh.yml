name: Refresh Helltrack Cache

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run cache build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PINKBIKE_PROXY: ${{ secrets.PINKBIKE_PROXY }}
        run: node scripts/build-cache.js

      - name: Commit updated cache
        run: |
          git config user.name "Helltrack Bot"
          git config user.email "helltrack-bot@users.noreply.github.com"
          git pull --rebase origin main
          git add public/cache.json
          git diff --staged --quiet || git commit -m "chore: refresh cache $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
