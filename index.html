<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="UCI downhill and enduro race content. No fluff.">
<title>Helltrack</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --acid: #d4f500;
  --acid-dim: rgba(212,245,0,0.08);
  --acid-border: rgba(212,245,0,0.2);
  --bg: #111111;
  --bg-card: #191919;
  --bg-card-hover: #1e1e1e;
  --bg-sheet: #191919;
  --border: #222222;
  --border-mid: #2a2a2a;
  --text-primary: #e8e8e0;
  --text-secondary: #888880;
  --text-muted: #444440;
  --pb-orange: #e05a1e;
  --pb-dim: rgba(224,90,30,0.1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'Barlow', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  min-height: 100vh;
}

/* ── Header ── */
#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: calc(var(--safe-top) + 14px) 16px 0;
}
#header-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 12px;
}
#logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--acid);
  line-height: 1;
}
#logo-sub {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 3px;
}
#refresh-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  color: var(--text-muted);
  font-size: 20px;
  line-height: 1;
  transition: color 0.2s;
}
#refresh-btn:hover { color: var(--acid); }
#refresh-btn.spinning { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Tabs ── */
#tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#tabs::-webkit-scrollbar { display: none; }
.tab {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 8px 14px 10px;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.tab.active { color: var(--acid); border-bottom-color: var(--acid); }
.tab:hover:not(.active) { color: var(--text-secondary); }

/* ── Feed ── */
#feed { padding: 0 0 calc(var(--safe-bottom) + 24px); }

/* ── Section ── */
.section {
  padding: 20px 16px 4px;
  animation: fadeUp 0.3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.section-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── Hero card ── */
.card-hero {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.card-hero:hover { border-color: var(--border-mid); background: var(--bg-card-hover); }
.card-hero:active { opacity: 0.85; }

.hero-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  background: #1a1a1a;
  position: relative;
  overflow: hidden;
}
.hero-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.3s;
}
.hero-thumb img.loading { opacity: 0; }
.hero-thumb img.loaded { opacity: 1; }
.thumb-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #161616;
}
.thumb-placeholder.hidden { display: none; }
.play-btn-large {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--acid-dim);
  border: 1.5px solid var(--acid-border);
  display: flex;
  align-items: center;
  justify-content: center;
}
.play-icon { width:0; height:0; border-style:solid; border-width:8px 0 8px 14px; border-color:transparent transparent transparent var(--acid); margin-left:3px; }
.article-icon-large { font-size:32px; color: var(--pb-orange); opacity:0.5; }
.source-pill {
  position: absolute;
  bottom: 8px; left: 8px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 3px;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
}
.source-pill.youtube { color: var(--acid); }
.source-pill.pinkbike { color: var(--pb-orange); }
.source-pill.downtime { color: #a78bfa; }

.hero-body { padding: 10px 12px 13px; }
.card-title {
  font-size: 14px; font-weight: 500;
  color: var(--text-primary);
  line-height: 1.4;
  margin-bottom: 6px;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
}
.meta-source { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.08em; }
.meta-source.youtube { color: rgba(212,245,0,0.5); }
.meta-source.pinkbike { color: rgba(224,90,30,0.6); }
.meta-source.downtime { color: rgba(167,139,250,0.6); }
.meta-dot { width:2px; height:2px; border-radius:50%; background: var(--text-muted); }

/* ── Row card ── */
.card-row {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  margin-bottom: 8px;
  display: flex;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.card-row:hover { border-color: var(--border-mid); background: var(--bg-card-hover); }
.card-row:active { opacity: 0.85; }
.row-thumb {
  width: 88px; min-width: 88px; height: 66px;
  background: #161616;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.row-thumb img {
  width:100%; height:100%; object-fit:cover; display:block;
  transition: opacity 0.3s;
}
.row-thumb img.loading { opacity:0; }
.row-thumb img.loaded { opacity:1; }
.play-btn-small {
  width:28px; height:28px; border-radius:50%;
  background: var(--acid-dim);
  display:flex; align-items:center; justify-content:center;
  position:absolute;
}
.play-icon-sm { width:0; height:0; border-style:solid; border-width:5px 0 5px 9px; border-color:transparent transparent transparent var(--acid); margin-left:2px; }
.article-icon-sm { font-size:20px; color: var(--pb-orange); opacity:0.5; }
.podcast-icon-sm { font-size:20px; color:#a78bfa; opacity:0.5; }
.row-body {
  padding: 8px 11px;
  flex:1; min-width:0;
  display:flex; flex-direction:column; justify-content:space-between;
}
.row-title {
  font-size: 12.5px; font-weight:500;
  color: var(--text-primary);
  line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* ── Loading / error ── */
#loading {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding: 80px 24px; gap:16px;
}
.loader-ring {
  width:36px; height:36px;
  border: 2px solid var(--border-mid);
  border-top-color: var(--acid);
  border-radius:50%;
  animation: spin 0.8s linear infinite;
}
.loader-text {
  font-family:'Barlow Condensed', sans-serif;
  font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  color: var(--text-muted);
}
#error-state { display:none; padding:60px 24px; text-align:center; }
#error-state p {
  font-family:'Barlow Condensed', sans-serif;
  font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
  color: var(--text-muted); margin-bottom:16px;
}
#retry-btn {
  font-family:'Barlow Condensed', sans-serif;
  font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
  color: var(--acid);
  background: var(--acid-dim);
  border: 1px solid var(--acid-border);
  border-radius:6px; padding:8px 20px; cursor:pointer;
}
#updated {
  font-family:'Barlow Condensed', sans-serif;
  font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
  color: var(--text-muted); text-align:center; padding:16px; opacity:0.5;
}

/* ── Bottom sheet ── */
#sheet-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  backdrop-filter: blur(2px);
}
#sheet-overlay.open { display: block; }

#sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  max-height: 88vh;
  background: var(--bg-sheet);
  border-radius: 16px 16px 0 0;
  border-top: 0.5px solid var(--border-mid);
  overflow-y: auto;
  z-index: 201;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: calc(var(--safe-bottom) + 16px);
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
#sheet.open { transform: translateY(0); }

.sheet-handle {
  width: 36px; height: 4px;
  background: #333;
  border-radius: 2px;
  margin: 10px auto 0;
}

#sheet-thumb {
  width:100%;
  aspect-ratio: 16/9;
  background: #141414;
  display:flex; align-items:center; justify-content:center;
  margin-top: 12px;
  position: relative;
  overflow: hidden;
}
#sheet-thumb img {
  width:100%; height:100%; object-fit:cover; display:block;
  transition: opacity 0.3s;
}
#sheet-thumb img.loading { opacity:0; }
#sheet-thumb img.loaded { opacity:1; }
.sheet-play-center {
  position: absolute;
  width:56px; height:56px; border-radius:50%;
  background: rgba(212,245,0,0.1);
  border: 1.5px solid rgba(212,245,0,0.25);
  display:flex; align-items:center; justify-content:center;
}
.sheet-play-tri { width:0; height:0; border-style:solid; border-width:10px 0 10px 17px; border-color:transparent transparent transparent var(--acid); margin-left:3px; }

.sheet-body { padding: 14px 16px 0; }

.sheet-badges {
  display:flex; align-items:center; gap:8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.sheet-source {
  font-family:'Barlow Condensed', sans-serif;
  font-size:9px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
  padding: 3px 8px; border-radius:3px;
}
.sheet-source.youtube { color: var(--acid); background: var(--acid-dim); }
.sheet-source.pinkbike { color: var(--pb-orange); background: var(--pb-dim); }
.sheet-source.downtime { color:#a78bfa; background:rgba(167,139,250,0.08); }
.sheet-cat {
  font-family:'Barlow Condensed', sans-serif;
  font-size:9px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
  padding: 3px 8px; border-radius:3px;
  color: var(--text-muted); background:#222;
}
.sheet-age { font-size:11px; color: var(--text-muted); margin-left:auto; }

#sheet-title {
  font-size:17px; font-weight:500;
  color: var(--text-primary);
  line-height:1.35;
  margin-bottom:10px;
}

#sheet-desc {
  font-size:13px;
  color: #666;
  line-height:1.65;
  margin-bottom:16px;
}

#sheet-venue {
  display:none;
  padding: 10px 0;
  border-top: 0.5px solid var(--border);
  border-bottom: 0.5px solid var(--border);
  margin-bottom: 16px;
  gap: 0;
}
.venue-item { flex:1; text-align:center; }
.venue-val {
  font-family:'Barlow Condensed', sans-serif;
  font-size:14px; font-weight:600;
  color: var(--text-primary);
  line-height:1; margin-bottom:3px;
}
.venue-label {
  font-size:9px; letter-spacing:0.12em; text-transform:uppercase;
  color: var(--text-muted);
}
.venue-div { width:1px; background: var(--border); margin: 4px 0; }

#sheet-cta {
  display:block; width:100%;
  padding:14px;
  background: var(--acid);
  color:#111;
  font-family:'Barlow Condensed', sans-serif;
  font-size:14px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
  border:none; border-radius:8px;
  cursor:pointer; text-align:center; text-decoration:none;
  transition: opacity 0.15s;
}
#sheet-cta:active { opacity:0.85; }

#sheet-dismiss {
  display:block; width:100%;
  padding:12px;
  background:none;
  color: var(--text-muted);
  font-family:'Barlow Condensed', sans-serif;
  font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
  border:none; cursor:pointer; margin-top:6px;
}

/* ── Results tab ── */
#results-view { display:none; padding:0 0 calc(var(--safe-bottom) + 24px); }
#results-view.active { display:block; }

.rs-round-bar {
  display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
  -webkit-overflow-scrolling:touch; padding:14px 16px 0;
}
.rs-round-bar::-webkit-scrollbar { display:none; }
.rs-round-pill {
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
  padding:5px 12px; border-radius:20px; white-space:nowrap;
  border:0.5px solid var(--border); color:var(--text-muted);
  background:var(--bg-card); cursor:pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.rs-round-pill.active {
  background:var(--acid-dim); border-color:var(--acid-border); color:var(--acid);
}

.rs-gender-toggle {
  display:flex; margin:12px 16px 0;
  background:var(--bg-card); border:0.5px solid var(--border); border-radius:8px; overflow:hidden;
}
.rs-gender-btn {
  flex:1; padding:9px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
  text-align:center; color:var(--text-muted); cursor:pointer;
  transition: color 0.15s, background 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.rs-gender-btn.active { background:var(--acid-dim); color:var(--acid); }

.rs-section { padding:16px 16px 4px; }
.rs-section-label {
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase;
  color:var(--text-muted); margin-bottom:12px;
  display:flex; align-items:center; gap:10px;
}
.rs-section-label::after { content:''; flex:1; height:1px; background:var(--border); }

/* Top 5 — visual weight by position */
.rs-top5 { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }

.rs-hero-row {
  display:flex; align-items:center; gap:12px;
  background:var(--bg-card); border:0.5px solid var(--border);
  border-radius:10px; padding:12px 14px;
  position:relative; overflow:hidden;
}
.rs-hero-row.pos-1 { border-color:rgba(212,245,0,0.35); background:rgba(212,245,0,0.06); }
.rs-hero-row.pos-2 { border-color:rgba(192,192,192,0.25); background:rgba(192,192,192,0.04); }
.rs-hero-row.pos-3 { border-color:rgba(180,120,60,0.25); background:rgba(180,120,60,0.04); }
.rs-hero-row.pos-4,
.rs-hero-row.pos-5 { background:var(--bg-card); }

.rs-pos-num {
  font-family:'Barlow Condensed',sans-serif;
  font-size:28px; font-weight:700; line-height:1;
  color:var(--text-muted); min-width:28px; text-align:center;
}
.pos-1 .rs-pos-num { color:var(--acid); font-size:32px; }
.pos-2 .rs-pos-num { color:#c0c0c0; }
.pos-3 .rs-pos-num { color:#b47c3c; }

.rs-rider-info { flex:1; min-width:0; }
.rs-rider-name {
  font-size:14px; font-weight:500; color:var(--text-primary);
  line-height:1.2; margin-bottom:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pos-1 .rs-rider-name { font-size:15px; }
.rs-rider-nat {
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--text-muted);
}

.rs-time-col { text-align:right; }
.rs-time {
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px; font-weight:600; font-variant-numeric:tabular-nums;
  color:var(--text-primary); line-height:1;
}
.pos-1 .rs-time { color:var(--acid); font-size:16px; }
.rs-gap {
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px; color:var(--text-muted);
  font-variant-numeric:tabular-nums; margin-top:3px;
}
.pos-1 .rs-gap { color:rgba(212,245,0,0.5); }

/* Full results table */
.rs-table { width:100%; border-collapse:collapse; }
.rs-table tr { border-bottom:0.5px solid #1a1a1a; }
.rs-table tr:last-child { border-bottom:none; }
.rs-table td { padding:7px 4px; font-size:12px; vertical-align:middle; }
.rs-td-rank {
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px; font-weight:600; color:var(--text-muted);
  width:26px; text-align:center;
}
.rs-td-nat {
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--text-muted); width:34px;
}
.rs-td-name { color:var(--text-primary); font-weight:500; }
.rs-td-time {
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px; font-variant-numeric:tabular-nums;
  color:var(--text-secondary); text-align:right; white-space:nowrap;
}
.rs-td-gap {
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px; font-variant-numeric:tabular-nums;
  color:var(--text-muted); text-align:right; white-space:nowrap; width:48px;
}
.rs-td-pts {
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px; color:var(--text-muted); text-align:right; width:24px;
}

.rs-empty {
  padding:48px 24px; text-align:center;
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--text-muted);
}

.rs-session-toggle {
  display:flex; margin:8px 16px 0;
  background:var(--bg-card); border:0.5px solid var(--border);
  border-radius:8px; overflow:hidden;
}
.rs-session-btn {
  flex:1; padding:7px 4px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
  text-align:center; color:var(--text-muted); cursor:pointer;
  transition: color 0.15s, background 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.rs-session-btn.active { background:var(--acid-dim); color:var(--acid); }


  #bottom-nav {
    position: static;
    border-top: none;
    border-bottom: 0.5px solid #222;
    padding-bottom: 0;
    max-width: 100%;
    background: #0d0d0d;
    order: -1;
  }
  .nav-btn {
    flex-direction: row;
    gap: 8px;
    padding: 14px 24px;
    flex: 0;
  }
  .nav-btn-icon { font-size: 18px; }
  .nav-btn-label { font-size: 11px; letter-spacing: 0.1em; }
  #main-area {
    padding-bottom: 0;
  }
  #header {
    top: 53px;
  }
}
</style>
</head>
<body>

<div id="header">
  <div id="header-top">
    <div>
      <div id="logo">Helltrack</div>
      <div id="logo-sub">UCI Downhill &amp; Enduro</div>
    </div>
    <button id="refresh-btn" aria-label="Refresh feed" onclick="loadFeed(true)">↻</button>
  </div>
  <div id="tabs"></div>
</div>

<div id="feed">
  <div id="loading">
    <div class="loader-ring"></div>
    <div class="loader-text">Loading race feed</div>
  </div>
  <div id="error-state">
    <p>Failed to load feed</p>
    <button id="retry-btn" onclick="loadFeed(true)">Retry</button>
  </div>
  <div id="content"></div>
  <div id="updated"></div>
</div>

<!-- Results tab view -->
<div id="results-view">
  <div class="rs-round-bar" id="rs-round-bar"></div>
  <div class="rs-gender-toggle">
    <div class="rs-gender-btn active" id="rs-men-btn" onclick="setGender('men')">Elite Men</div>
    <div class="rs-gender-btn" id="rs-women-btn" onclick="setGender('women')">Elite Women</div>
  </div>
  <div class="rs-session-toggle" id="rs-session-bar">
    <div class="rs-session-btn active" data-session="finals" onclick="setSession('finals')">Finals</div>
    <div class="rs-session-btn" data-session="q1" onclick="setSession('q1')">Qual 1</div>
    <div class="rs-session-btn" data-session="q2" onclick="setSession('q2')">Qual 2</div>
  </div>
  <div id="rs-content"></div>
</div>

<!-- Install banner -->
<div id="install-banner" style="display:none; position:fixed; bottom:0; left:0; right:0; z-index:300; padding:12px 16px calc(var(--safe-bottom) + 12px); background:#191919; border-top:0.5px solid #2a2a2a; align-items:center; gap:12px;">
  <div style="flex:1">
    <div style="font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-primary); margin-bottom:2px">Add to home screen</div>
    <div style="font-size:11px; color:var(--text-muted)">One tap. Always fresh. No app store.</div>
  </div>
  <button id="install-btn" style="font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; background:var(--acid); color:#111; border:none; border-radius:6px; padding:9px 16px; cursor:pointer; white-space:nowrap;">Install</button>
  <button onclick="dismissInstall()" style="background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer; padding:4px; line-height:1;">×</button>
</div>

<!-- Bottom sheet -->
<div id="sheet-overlay" onclick="closeSheet()"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div id="sheet-thumb"></div>
  <div class="sheet-body">
    <div class="sheet-badges">
      <span id="sheet-source-badge" class="sheet-source"></span>
      <span id="sheet-cat-badge" class="sheet-cat"></span>
      <span id="sheet-age" class="sheet-age"></span>
    </div>
    <div id="sheet-title"></div>
    <div id="sheet-desc"></div>
    <div id="sheet-venue">
      <div class="venue-item">
        <div class="venue-val" id="venue-discipline"></div>
        <div class="venue-label">Discipline</div>
      </div>
      <div class="venue-div"></div>
      <div class="venue-item">
        <div class="venue-val" id="venue-location"></div>
        <div class="venue-label">Venue</div>
      </div>
      <div class="venue-div"></div>
      <div class="venue-item">
        <div class="venue-val" id="venue-type"></div>
        <div class="venue-label">Format</div>
      </div>
    </div>
    <a id="sheet-cta" href="#" target="_blank" rel="noopener">Watch on YouTube</a>
    <button id="sheet-dismiss" onclick="closeSheet()">Dismiss</button>
  </div>
</div>

<script>
const CACHE_URL = 'public/cache.json'

const CAT_LABELS = {
  'race-runs': 'Race runs',
  'results':   'Analysis',
  'films':     'Films',
  'paddock':   'Paddock',
  'news':      'News',
}

// Venue detection from title/description
const VENUES = ['fort william','leogang','val di sole','loudenvielle','les gets','champery','vallnord','snowshoe','mont sainte anne','lake placid','bielsko','maydena','cairns','south korea','nove mesto','yongpyong']
const DH_SIGNALS = ['downhill','dh world cup','dh','race run','qualifying','finals','vital raw']
const ENDURO_SIGNALS = ['enduro','ews','edr','stage']

function timeAgo(dateStr) {
  if (!dateStr) return ''
  const diff = Date.now() - new Date(dateStr).getTime()
  const mins = Math.floor(diff / 60000)
  if (mins < 2) return 'just now'
  if (mins < 60) return mins + 'm ago'
  const hrs = Math.floor(mins / 60)
  if (hrs < 24) return hrs + 'h ago'
  return Math.floor(hrs / 24) + 'd ago'
}

function srcClass(item) {
  if (item.source === 'pinkbike') return 'pinkbike'
  if (item.source === 'downtime') return 'downtime'
  return 'youtube'
}

function ctaLabel(item) {
  if (item.source === 'pinkbike') return 'Read on Pinkbike'
  if (item.source === 'downtime') return 'Listen on Downtime'
  if (item.type === 'podcast')    return 'Listen on YouTube'
  return 'Watch on YouTube'
}

function srcName(item) {
  if (item.source === 'pinkbike') return 'Pinkbike'
  if (item.source === 'downtime') return 'Downtime'
  return item.channelName || 'YouTube'
}

function detectVenue(item) {
  const text = (item.title + ' ' + (item.description || '')).toLowerCase()
  const venue = VENUES.find(v => text.includes(v))
  const isDH = DH_SIGNALS.some(s => text.includes(s))
  const isEnduro = ENDURO_SIGNALS.some(s => text.includes(s))
  const isQual = /qualif|seeding/.test(text)
  const isFinals = /final|winner|podium/.test(text)
  return {
    venue: venue ? venue.split(' ').map(w => w[0].toUpperCase() + w.slice(1)).join(' ') : null,
    discipline: isDH ? 'DH' : isEnduro ? 'Enduro' : null,
    format: isQual ? 'Qualifying' : isFinals ? 'Finals' : item.type === 'article' ? 'Article' : item.type === 'podcast' ? 'Podcast' : 'Video',
  }
}

function lazyImg(src, cls) {
  if (!src) return ''
  return `<img src="${src}" class="${cls} loading" loading="lazy"
    onerror="this.parentElement.querySelector('.thumb-placeholder')?.classList.remove('hidden');this.style.display='none'"
    onload="this.classList.remove('loading');this.classList.add('loaded');this.parentElement.querySelector('.thumb-placeholder')?.classList.add('hidden')">`
}

let activeItem = null

function openSheet(item) {
  activeItem = item
  const sc = srcClass(item)
  const isArticle = item.type === 'article'
  const isPodcast = item.type === 'podcast'

  // Thumb
  const thumbEl = document.getElementById('sheet-thumb')
  if (item.thumbnail) {
    thumbEl.innerHTML = `${lazyImg(item.thumbnail, 'sheet-img')}
      ${!isArticle && !isPodcast ? `<div class="sheet-play-center"><div class="sheet-play-tri"></div></div>` : ''}`
  } else {
    thumbEl.innerHTML = `<div style="font-size:48px;opacity:0.3">${isArticle ? '≡' : isPodcast ? '♪' : '▶'}</div>`
  }

  // Badges
  const sb = document.getElementById('sheet-source-badge')
  sb.textContent = srcName(item)
  sb.className = 'sheet-source ' + sc

  document.getElementById('sheet-cat-badge').textContent = CAT_LABELS[item.category] || item.category
  document.getElementById('sheet-age').textContent = timeAgo(item.publishedAt)
  document.getElementById('sheet-title').textContent = item.title
  document.getElementById('sheet-desc').textContent = item.description || ''

  // Venue row
  const meta = detectVenue(item)
  const venueEl = document.getElementById('sheet-venue')
  if (meta.venue || meta.discipline) {
    venueEl.style.display = 'flex'
    document.getElementById('venue-discipline').textContent = meta.discipline || '—'
    document.getElementById('venue-location').textContent = meta.venue || '—'
    document.getElementById('venue-type').textContent = meta.format
  } else {
    venueEl.style.display = 'none'
  }

  // CTA
  const cta = document.getElementById('sheet-cta')
  cta.textContent = ctaLabel(item)
  cta.href = item.url || '#'

  // Open
  document.getElementById('sheet-overlay').classList.add('open')
  document.getElementById('sheet').classList.add('open')
  document.body.style.overflow = 'hidden'
}

function closeSheet() {
  document.getElementById('sheet-overlay').classList.remove('open')
  document.getElementById('sheet').classList.remove('open')
  document.body.style.overflow = ''
  activeItem = null
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet() })

// Swipe down to dismiss
let touchStartY = 0
const sheet = document.getElementById('sheet')
sheet.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY }, { passive: true })
sheet.addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - touchStartY > 80) closeSheet()
}, { passive: true })

function renderHero(item) {
  const sc = srcClass(item)
  const isArticle = item.type === 'article'
  return `<div class="card-hero" onclick='openSheet(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
  <div class="hero-thumb">
    ${lazyImg(item.thumbnail, 'hero-img')}
    <div class="thumb-placeholder${item.thumbnail ? '' : ''}">
      ${isArticle ? `<div class="article-icon-large">≡</div>` : `<div class="play-btn-large"><div class="play-icon"></div></div>`}
    </div>
    <div class="source-pill ${sc}">${srcName(item)}</div>
  </div>
  <div class="hero-body">
    <div class="card-title">${item.title}</div>
    <div class="card-meta">
      <span class="meta-source ${sc}">${srcName(item)}</span>
      <div class="meta-dot"></div>
      <span>${timeAgo(item.publishedAt)}</span>
    </div>
  </div>
</div>`
}

function renderRow(item) {
  const sc = srcClass(item)
  const isArticle = item.type === 'article'
  const isPodcast = item.type === 'podcast'
  let thumbContent = isArticle
    ? `<div class="article-icon-sm">≡</div>`
    : isPodcast
      ? `<div class="podcast-icon-sm">♪</div>`
      : `<div class="play-btn-small"><div class="play-icon-sm"></div></div>`
  return `<div class="card-row" onclick='openSheet(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
  <div class="row-thumb">
    ${lazyImg(item.thumbnail, 'row-img')}
    ${thumbContent}
  </div>
  <div class="row-body">
    <div class="row-title">${item.title}</div>
    <div class="card-meta" style="margin-top:4px">
      <span class="meta-source ${sc}">${srcName(item)}</span>
      <div class="meta-dot"></div>
      <span>${timeAgo(item.publishedAt)}</span>
    </div>
  </div>
</div>`
}

let data = null
let activeTab = 'all'

function renderFeed() {
  if (!data) return
  const content = document.getElementById('content')
  const cats = data.categories || {}
  let html = ''

  const entries = activeTab === 'all'
    ? Object.entries(cats)
    : Object.entries(cats).filter(([id]) => id === activeTab)

  for (const [id, cat] of entries) {
    if (!cat.items?.length) continue
    html += `<div class="section"><div class="section-label">${CAT_LABELS[id] || cat.label}</div>`
    cat.items.forEach((item, i) => {
      html += i === 0 ? renderHero(item) : renderRow(item)
    })
    html += '</div>'
  }

  if (!html) {
    html = `<div style="padding:60px 24px;text-align:center">
      <p style="font-family:'Barlow Condensed';font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted)">No content in this category</p>
    </div>`
  }

  content.innerHTML = html
  if (data.builtAt) document.getElementById('updated').textContent = 'Updated ' + timeAgo(data.builtAt)
}

function buildTabs() {
  const tabs = document.getElementById('tabs')
  const cats = data?.categories || {}
  const all = [
    { id:'all', label:'All' },
    { id:'results', label:'Results' },
    ...Object.keys(cats).map(id => ({ id, label: CAT_LABELS[id] || id })),
  ]
  tabs.innerHTML = all.map(t => `<div class="tab${t.id===activeTab?' active':''}" data-tab="${t.id}">${t.label}</div>`).join('')
  tabs.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => {
      activeTab = el.dataset.tab
      tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
      el.classList.add('active')
      if (activeTab === 'results') {
        document.getElementById('feed').style.display = 'none'
        document.getElementById('results-view').classList.add('active')
        if (!resultsData) loadResults()
        else renderResults()
      } else {
        document.getElementById('feed').style.display = 'block'
        document.getElementById('results-view').classList.remove('active')
        renderFeed()
      }
      window.scrollTo({ top:0, behavior:'smooth' })
    })
  })
}

async function loadFeed(force=false) {
  const btn = document.getElementById('refresh-btn')
  btn.classList.add('spinning')
  try {
    const res = await fetch(force ? CACHE_URL+'?t='+Date.now() : CACHE_URL)
    if (!res.ok) throw new Error('HTTP '+res.status)
    data = await res.json()
    document.getElementById('loading').style.display = 'none'
    document.getElementById('error-state').style.display = 'none'
    buildTabs()
    renderFeed()
  } catch(err) {
    console.error(err)
    document.getElementById('loading').style.display = 'none'
    document.getElementById('error-state').style.display = 'block'
  } finally {
    btn.classList.remove('spinning')
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(console.error)
}


// ── Install banner ──
let deferredPrompt = null

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault()
  deferredPrompt = e
  if (!localStorage.getItem('helltrack-install-dismissed')) {
    const banner = document.getElementById('install-banner')
    banner.style.display = 'flex'
    // push feed up so banner doesn't cover last card
    document.getElementById('feed').style.paddingBottom = 'calc(var(--safe-bottom) + 90px)'
  }
})

document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return
  deferredPrompt.prompt()
  const { outcome } = await deferredPrompt.userChoice
  deferredPrompt = null
  dismissInstall()
})

window.addEventListener('appinstalled', () => { dismissInstall() })

function dismissInstall() {
  document.getElementById('install-banner').style.display = 'none'
  document.getElementById('feed').style.paddingBottom = ''
  localStorage.setItem('helltrack-install-dismissed', '1')
}

// ── Results tab ──────────────────────────────────────────────────────────────

const RESULTS_URL = 'public/results.json'
let resultsData   = null
let activeSeason  = '2026'
let activeRound   = 0
let activeGender  = 'men'
let activeSession = 'finals'

function formatName(raw) {
  return raw.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ')
}

function currentRounds() {
  return resultsData?.seasons?.[activeSeason]?.rounds
    || resultsData?.rounds
    || []
}

function buildSeasonBar() {
  const seasons = Object.keys(resultsData?.seasons || {}).sort().reverse()
  const bar = document.getElementById('rs-round-bar')
  const seasonPills = seasons.map(yr =>
    `<div class="rs-round-pill${yr === activeSeason ? ' active' : ''} rs-season-pill"
      onclick="setSeason('${yr}')">${yr}</div>`
  ).join('')
  const rounds = currentRounds()
  const roundPills = rounds.map((r, i) => {
    const label = r.type === 'World Championships'
      ? `WC · ${r.venue.split(' ')[0]}`
      : `R${r.round} · ${r.venue.split(' ')[0]}`
    return `<div class="rs-round-pill${i === activeRound ? ' active' : ''}"
      onclick="setRound(${i})">${label}</div>`
  }).join('')
  bar.innerHTML = `<div style="display:flex;gap:6px;padding-right:8px;border-right:0.5px solid #222;margin-right:2px">${seasonPills}</div>${roundPills}`
}

function setSeason(yr) {
  activeSeason = yr
  activeRound  = Math.max(0, currentRounds().length - 1)
  buildSeasonBar()
  updateSessionBar()
  renderResults()
}

function setRound(idx) {
  activeRound = idx
  buildSeasonBar()
  updateSessionBar()
  renderResults()
}

function setGender(g) {
  activeGender = g
  document.getElementById('rs-men-btn').classList.toggle('active', g === 'men')
  document.getElementById('rs-women-btn').classList.toggle('active', g === 'women')
  updateSessionBar()
  renderResults()
}

function setSession(s) {
  activeSession = s
  document.querySelectorAll('.rs-session-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.session === s)
  })
  renderResults()
}

function sessionKey() {
  const suffix = activeGender === 'men' ? 'men' : 'women'
  if (activeSession === 'finals') return `finals-${suffix}`
  if (activeSession === 'q1')     return `qualifying-1-${suffix}`
  if (activeSession === 'q2')     return `qualifying-2-${suffix}`
  return `finals-${suffix}`
}

function updateSessionBar() {
  // Show/hide Q1/Q2 pills based on whether data exists for this round
  const round   = resultsData?.rounds?.[activeRound]
  const suffix  = activeGender === 'men' ? 'men' : 'women'
  const hasQ1   = !!(round?.sessions?.[`qualifying-1-${suffix}`]?.length)
  const hasQ2   = !!(round?.sessions?.[`qualifying-2-${suffix}`]?.length)
  const bar     = document.getElementById('rs-session-bar')
  if (bar) {
    bar.querySelector('[data-session="q1"]').style.display = hasQ1 ? '' : 'none'
    bar.querySelector('[data-session="q2"]').style.display = hasQ2 ? '' : 'none'
  }
}

function renderResults() {
  const el     = document.getElementById('rs-content')
  const rounds = currentRounds()
  if (!rounds.length) {
    el.innerHTML = `<div class="rs-empty">No results yet — check back after race weekend</div>`
    return
  }

  const round    = rounds[activeRound]
  const suffix   = activeGender === 'men' ? 'men' : 'women'
  const isFinals = activeSession === 'finals'
  let key = sessionKey()
  let session = round?.sessions?.[key] || []
  if (!session.length && activeSession === 'q1') {
    session = round?.sessions?.[`qualifying-${suffix}`] || []
  }

  if (!session.length) {
    el.innerHTML = `<div class="rs-empty">Results not yet available</div>`
    return
  }

  const top5 = isFinals ? session.slice(0, 5) : session.slice(0, 3)
  const rest  = isFinals ? session.slice(5)   : session.slice(3)

  const top5Html = top5.map(r => {
    const posClass = isFinals ? `pos-${r.rank}` : `pos-${r.rank <= 3 ? r.rank : 4}`
    const name     = formatName(r.name)
    const gap      = r.rank === 1 ? 'Fastest' : r.gap || ''
    return `<div class="rs-hero-row ${posClass}">
  <div class="rs-pos-num">${r.rank}</div>
  <div class="rs-rider-info">
    <div class="rs-rider-name">${name}</div>
    <div class="rs-rider-nat">${r.nat || ''}</div>
  </div>
  <div class="rs-time-col">
    <div class="rs-time">${r.time}</div>
    <div class="rs-gap">${gap}</div>
  </div>
</div>`
  }).join('')

  const tableRows = rest.map(r => {
    const name = formatName(r.name)
    return `<tr>
  <td class="rs-td-rank">${r.rank}</td>
  <td class="rs-td-nat">${r.nat || ''}</td>
  <td class="rs-td-name">${name}</td>
  <td class="rs-td-time">${r.time}</td>
  <td class="rs-td-gap">${r.gap || ''}</td>
  <td class="rs-td-pts">${r.points || ''}</td>
</tr>`
  }).join('')

  const sessionLabel = activeSession === 'finals' ? 'Finals'
    : activeSession === 'q1' ? 'Qualifying 1'
    : 'Qualifying 2'
  const venueDate = new Date(round.date).toLocaleDateString('en-US', { month:'short', day:'numeric' })

  el.innerHTML = `
<div class="rs-section">
  <div class="rs-section-label">${round.venue} · ${venueDate} · ${sessionLabel}</div>
  <div class="rs-top5">${top5Html}</div>
  ${rest.length ? `
  <div class="rs-section-label">Full results</div>
  <table class="rs-table">
    <tbody>${tableRows}</tbody>
  </table>` : ''}
</div>`
}

async function loadResults() {
  try {
    const res  = await fetch(RESULTS_URL + '?t=' + Date.now())
    if (!res.ok) throw new Error('HTTP ' + res.status)
    resultsData = await res.json()
    const seasons = Object.keys(resultsData?.seasons || {}).sort()
    activeSeason  = seasons[seasons.length - 1] || '2026'
    const rounds  = currentRounds()
    activeRound   = Math.max(0, rounds.length - 1)
    buildSeasonBar()
    updateSessionBar()
    renderResults()
  } catch(err) {
    console.error('Results load failed:', err)
    document.getElementById('rs-content').innerHTML =
      `<div class="rs-empty">Results unavailable</div>`
  }
}


loadFeed()
</script>
